<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1610" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ACT Command" />

    <title>ACT Command — Free Enhanced ACT Prep</title>
    <meta
      name="description"
      content="Free Enhanced ACT prep: %QUESTION_TOTAL% practice questions with explanations, skill lessons, timed practice and seven ranks to earn. No account needed."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts are self-hosted and imported from src/main.tsx. They used to come
         from Google over two preconnects and a stylesheet, which meant every
         visitor's IP reached a third party before the page painted. -->

    <!-- There used to be a `<link rel="preload" as="image">` for
         /art/world-map.webp here. It never saved a byte, because it preloaded
         a file nothing loads: `Art` resolves the map through a <picture> whose
         sources are /art/gen/world-map-768.avif (200 KB) and its webp sibling,
         and the 297 KB original is only the last-resort <img src> fallback. So
         every visitor to every screen downloaded 297 KB and then fetched the
         real image anyway. The browser said so, and "preloaded but not used"
         was the only warning in this app's console.

         Not re-pointed at the AVIF: the map is a lazy route, and warming its
         artwork while somebody is still reading the landing page spends a
         phone's data on a screen they may never open. -->

    <!-- How the link looks when a student sends it to a friend, which is
         realistically the only distribution this app has.

         This used to point at `/art/landing-hero.webp`: a wordless 1024×559
         painting, at a relative URL, in a format several crawlers still
         refuse. So the preview was a picture of some hills, cropped wrong,
         and often no picture at all. `/og.png` is drawn for the job by
         `scripts/build-og.mjs` — 1200×630, the app's own artwork and
         typeface, and the three facts that decide whether anyone taps.

         Absolute URLs, because the Open Graph spec requires them and
         Facebook, LinkedIn and Slack all enforce it even where Twitter
         does not. The width/height pair lets a crawler reserve the space
         before it has finished fetching the image. -->
    <link rel="canonical" href="https://act-red.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ACT Command" />
    <meta property="og:url" content="https://act-red.vercel.app/" />
    <meta property="og:title" content="ACT Command — Free Enhanced ACT Prep" />
    <meta
      property="og:description"
      content="%QUESTION_TOTAL% practice questions with explanations, skill lessons and timed practice. Explore four subjects and earn seven ranks. Free, no account needed."
    />
    <meta property="og:image" content="https://act-red.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ACT Command — free prep for the Enhanced ACT, over a painting of a valley with a village, forest and river."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://act-red.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The too-old-browser notice. A classic script, so it runs on browsers
         that cannot even parse the app's module. What it probes is what the
         app cannot do without: regex lookbehind (a parse-time SyntaxError on
         Safari before 16.4, which takes the whole bundle down to a blank
         page — none ship today, but the probe stays so one slipping back in
         degrades to this notice instead), and oklch() colour, which every
         colour token is written in (Safari 15.4, Chrome 111), so without it
         the screens render as unreadable defaults. The app root is hidden
         rather than emptied, so a browser that runs the module anyway does
         not paint a broken game behind the message.

         The CSP in vercel.json allows this script by its sha256 hash only.
         Any edit here — whitespace included — changes the hash, and
         scripts/csp-hash.test.mjs fails until vercel.json is updated. -->
    <script>
      (function () {
        var ok = true;
        try {
          new RegExp('(?<!a)b');
        } catch (e) {
          ok = false;
        }
        if (!(window.CSS && CSS.supports && CSS.supports('color', 'oklch(0 0 0)'))) ok = false;
        if (ok) return;
        var root = document.getElementById('root');
        if (root) root.style.display = 'none';
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText =
          'max-width:32rem;margin:15vh auto;padding:24px;font:18px/1.5 system-ui,sans-serif;color:#1c1610;background:#f6efe0;border:2px solid #1c1610;border-radius:12px';
        box.textContent =
          'Your browser is too old for ACT Command — please update it (iOS 16.4+, Chrome 111+).';
        document.body.insertBefore(box, root);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
