<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0718" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ACT Command" />

    <title>ACT Command — Free Enhanced ACT Prep</title>
    <meta
      name="description"
      content="Free prep for the Enhanced ACT: 754 practice questions with every choice explained, 60 lessons, timed section tests and a world map you climb one skill at a time. No account needed."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts are self-hosted and imported from src/main.tsx. They used to come
         from Google over two preconnects and a stylesheet, which meant every
         visitor's IP reached a third party before the page painted. -->

    <link rel="preload" as="image" href="/art/world-map.webp" />

    <!-- How the link looks when a student sends it to a friend, which is
         realistically the only distribution this app has. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ACT Command" />
    <meta property="og:title" content="ACT Command — Free Enhanced ACT Prep" />
    <meta
      property="og:description"
      content="754 practice questions with every choice explained, 60 lessons and timed tests, wrapped in a hand-drawn quest. Free, and no account needed."
    />
    <meta property="og:image" content="/art/landing-hero.webp" />
    <meta property="og:image:alt" content="A painted world map of the four ACT regions." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
